<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#101010" />
  <title>Creative Flow — Canvas MVP</title>
  <style>
    :root{
      --bg:#101010;
      --canvas:#141414;
      --panel:#181818;
      --node:#1f1f1f;
      --node-2:#242424;
      --border:#363636;
      --border-soft:#292929;
      --text:#f2f2f2;
      --muted:#9a9a9a;
      --muted-2:#707070;
      --accent:#d8c7a1;
      --accent-soft:rgba(216,199,161,.12);
      --danger:#e06b6b;
      --line:#7a7a7a;
      --cluster:rgba(216,199,161,.075);
      --cluster-border:rgba(216,199,161,.48);
      --safe-top:env(safe-area-inset-top, 0px);
      --safe-bottom:env(safe-area-inset-bottom, 0px);
      --topbar-h:58px;
      --dock-h:76px;
      --radius-xl:24px;
      --radius-lg:18px;
      --radius-md:14px;
      --shadow:0 18px 60px rgba(0,0,0,.35);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}
    body{position:fixed;inset:0;overscroll-behavior:none}
    button,input,textarea,select{font:inherit}
    button{border:0;cursor:pointer;color:inherit}

    #app{position:fixed;inset:0;background:var(--bg);overflow:hidden}

    .topbar{
      position:absolute;left:0;right:0;top:0;height:calc(var(--topbar-h) + var(--safe-top));
      padding:calc(10px + var(--safe-top)) 14px 8px;
      display:flex;align-items:center;gap:10px;z-index:50;
      background:linear-gradient(180deg,rgba(16,16,16,.98),rgba(16,16,16,.82) 70%,rgba(16,16,16,0));
      user-select:none;
    }
    .topbar__back,.topbar__menu{
      width:38px;height:38px;border-radius:14px;background:rgba(255,255,255,.055);
      display:grid;place-items:center;border:1px solid rgba(255,255,255,.07);
    }
    .topbar__title{min-width:0;flex:1}
    .topbar__title strong{display:block;font-size:15px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
    .topbar__title span{display:block;color:var(--muted);font-size:12px;line-height:15px;margin-top:1px}
    .modePill{
      display:none;padding:8px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);
      border:1px solid rgba(216,199,161,.25);font-size:12px;white-space:nowrap;
    }
    .modePill.active{display:block}

    .screen{position:absolute;inset:0;display:none}
    .screen.active{display:block}

    /* Projects */
    #projectsScreen{
      padding:calc(72px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));
      overflow:auto;
    }
    .heroTitle{font-size:30px;line-height:34px;margin:0 0 10px;letter-spacing:-.04em}
    .heroSub{color:var(--muted);font-size:14px;line-height:20px;margin:0 0 22px;max-width:330px}
    .projectList{display:flex;flex-direction:column;gap:12px}
    .projectCard{
      background:linear-gradient(180deg,#1b1b1b,#171717);
      border:1px solid var(--border-soft);border-radius:22px;padding:16px;
      box-shadow:0 10px 35px rgba(0,0,0,.18);
    }
    .projectCard h3{margin:0 0 6px;font-size:17px;letter-spacing:-.02em}
    .projectCard p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:18px}
    .projectMeta{display:flex;gap:8px;flex-wrap:wrap}
    .chip{font-size:12px;color:var(--muted);border:1px solid var(--border);background:rgba(255,255,255,.035);border-radius:999px;padding:6px 9px}
    .primaryWide{
      width:100%;height:54px;border-radius:18px;background:var(--accent);color:#16130c;
      font-weight:700;margin:18px 0 0;
    }

    /* Canvas */
    #canvasScreen{background:var(--canvas)}
    #canvasViewport{
      position:absolute;inset:0;overflow:hidden;touch-action:none;
      background:
        radial-gradient(circle at 50% 50%,rgba(255,255,255,.045) 1px,transparent 1.2px) 0 0/28px 28px,
        linear-gradient(180deg,#121212,#151515 42%,#101010);
    }
    #canvas{
      position:absolute;left:0;top:0;width:2600px;height:2600px;transform-origin:0 0;
      will-change:transform;
    }
    #edgesLayer{
      position:absolute;left:0;top:0;width:2600px;height:2600px;overflow:visible;z-index:1;pointer-events:none;
    }
    #clustersLayer{position:absolute;left:0;top:0;width:2600px;height:2600px;z-index:2;pointer-events:none}
    #nodesLayer{position:absolute;left:0;top:0;width:2600px;height:2600px;z-index:3}

    .node{
      position:absolute;min-width:86px;max-width:190px;min-height:42px;
      border-radius:15px;background:linear-gradient(180deg,var(--node-2),var(--node));
      border:1px solid var(--border);box-shadow:0 10px 24px rgba(0,0,0,.23);
      padding:10px 11px;touch-action:none;user-select:none;
      display:flex;gap:8px;align-items:center;
      transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease,background .16s ease;
    }
    .node.selected,.node.linkSource,.node.clusterSelect{
      border-color:var(--accent);box-shadow:0 0 0 4px rgba(216,199,161,.11),0 12px 26px rgba(0,0,0,.28);
    }
    .node.dragging{transition:none;box-shadow:0 18px 40px rgba(0,0,0,.45);z-index:10}
    .node__icon{
      width:22px;height:22px;border-radius:8px;background:rgba(216,199,161,.11);display:grid;place-items:center;
      color:var(--accent);font-size:13px;flex:0 0 auto;overflow:hidden;
    }
    .node__body{min-width:0;flex:1}
    .node__title{font-size:13px;line-height:16px;font-weight:680;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .node__meta{font-size:10px;line-height:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .node.imageNode,.node.linkNode{padding:6px;width:128px;display:block}
    .node.imageNode img,.node.linkNode .node__thumb{width:100%;height:84px;object-fit:cover;border-radius:11px;display:block;background:#0c0c0c}
    .node.imageNode .node__title,.node.linkNode .node__title{margin-top:6px;padding:0 4px}
    .node.linkNode .node__meta{padding:0 4px;margin-top:4px}
    .node.linkNode .node__thumbWrap{position:relative}
    .node.linkNode .node__badge{position:absolute;left:7px;bottom:7px;background:rgba(16,16,16,.84);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:4px 7px;font-size:10px;color:#f2f2f2;max-width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .node.colorNode .node__icon{background:var(--swatch,#333);border:1px solid rgba(255,255,255,.18)}

    .clusterBox{
      position:absolute;border-radius:26px;background:var(--cluster);
      border:1.5px solid var(--cluster-border);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);
      padding:12px;pointer-events:auto;
    }
    .clusterBox.selected{border-color:var(--accent);background:rgba(216,199,161,.12);box-shadow:0 0 0 5px rgba(216,199,161,.08)}
    .clusterLabel{
      position:absolute;left:14px;top:-31px;background:rgba(20,20,20,.92);
      border:1px solid rgba(216,199,161,.25);color:var(--accent);
      border-radius:999px;padding:6px 10px;font-size:12px;font-weight:680;white-space:nowrap;
      max-width:230px;overflow:hidden;text-overflow:ellipsis;
      backdrop-filter:blur(10px);
    }

    .edgePath{fill:none;stroke:var(--line);stroke-width:2.4;opacity:.95;stroke-linecap:round}
    .edgePath.supports{stroke:var(--accent)}
    .edgePath.contrasts{stroke:#b9b9b9;stroke-dasharray:8 10}
    .edgePath.leads{stroke:#a3b1b6}
    .edgeBranch{fill:none;stroke:rgba(216,199,161,.26);stroke-width:1.15;stroke-linecap:round;opacity:.95}
    .edgeBranch.contrasts{stroke:rgba(185,185,185,.24)}
    .edgeBranch.leads{stroke:rgba(163,177,182,.24)}
    .edgeGlow{fill:none;stroke:rgba(216,199,161,.08);stroke-width:7;stroke-linecap:round}
    .edgeLabel{fill:var(--muted);font-size:18px;paint-order:stroke;stroke:#141414;stroke-width:9;stroke-linejoin:round;letter-spacing:.02em}

    .bottomDock{
      position:absolute;left:12px;right:12px;bottom:calc(10px + var(--safe-bottom));
      min-height:64px;z-index:55;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;
      background:rgba(18,18,18,.82);border:1px solid rgba(255,255,255,.08);
      border-radius:24px;padding:8px;box-shadow:var(--shadow);backdrop-filter:blur(20px);
    }
    .dockBtn{
      border-radius:18px;background:rgba(255,255,255,.055);color:var(--text);font-size:12px;font-weight:650;
      min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    }
    .dockBtn strong{font-size:18px;line-height:18px}
    .dockBtn.active{background:var(--accent);color:#16130c}
    .dockBtn.danger{color:var(--danger)}

    .floatingTool{
      position:absolute;right:14px;bottom:calc(86px + var(--safe-bottom));
      z-index:52;display:flex;flex-direction:column;gap:8px;
    }
    .roundBtn{
      width:44px;height:44px;border-radius:16px;background:rgba(24,24,24,.86);
      color:var(--text);border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.3);
      backdrop-filter:blur(12px);
    }

    /* Panels */
    .overlay{
      position:absolute;inset:0;background:rgba(0,0,0,.42);z-index:80;display:none;
    }
    .overlay.active{display:block}
    .bottomSheet{
      position:absolute;left:0;right:0;bottom:0;z-index:90;
      background:linear-gradient(180deg,#1d1d1d,#151515);
      border-top:1px solid rgba(255,255,255,.09);
      border-radius:28px 28px 0 0;
      padding:10px 16px calc(16px + var(--safe-bottom));
      box-shadow:0 -22px 70px rgba(0,0,0,.52);
      transform:translateY(110%);
      transition:transform .22s ease;
      max-height:86dvh;overflow:auto;
    }
    .bottomSheet.active{transform:translateY(0)}
    .sheetGrab{width:42px;height:4px;border-radius:999px;background:#454545;margin:0 auto 14px}
    .sheetTitle{margin:0 0 4px;font-size:20px;letter-spacing:-.03em}
    .sheetText{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:19px}
    .row{display:flex;gap:10px;align-items:center}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .optionBtn{
      min-height:58px;text-align:left;border-radius:18px;background:rgba(255,255,255,.055);
      border:1px solid rgba(255,255,255,.075);padding:12px;
    }
    .optionBtn b{display:block;font-size:14px;margin-bottom:4px}
    .optionBtn span{display:block;color:var(--muted);font-size:12px;line-height:15px}
    .field{margin:12px 0}
    .label{display:block;color:var(--muted);font-size:12px;margin:0 0 7px}
    input,textarea,select{
      width:100%;background:#101010;color:var(--text);border:1px solid var(--border);
      border-radius:16px;padding:13px 14px;outline:none;
    }
    textarea{min-height:110px;resize:vertical}
    input:focus,textarea:focus,select:focus{border-color:rgba(216,199,161,.68);box-shadow:0 0 0 4px rgba(216,199,161,.08)}
    .primaryBtn,.secondaryBtn,.ghostBtn{
      height:50px;border-radius:17px;font-weight:750;
    }
    .primaryBtn{background:var(--accent);color:#17130c}
    .secondaryBtn{background:rgba(255,255,255,.07);color:var(--text);border:1px solid rgba(255,255,255,.08)}
    .ghostBtn{background:transparent;color:var(--muted)}
    .dangerBtn{background:rgba(224,107,107,.12);color:#ffb0b0;border:1px solid rgba(224,107,107,.2)}

    .toast{
      position:absolute;left:50%;bottom:calc(92px + var(--safe-bottom));z-index:120;
      transform:translate(-50%,20px);opacity:0;pointer-events:none;
      background:rgba(242,242,242,.92);color:#101010;border-radius:999px;padding:10px 14px;
      font-size:13px;font-weight:720;transition:.22s ease;box-shadow:0 18px 45px rgba(0,0,0,.25);
    }
    .toast.show{opacity:1;transform:translate(-50%,0)}

    .viewPanel{
      position:absolute;inset:0;z-index:70;background:var(--bg);display:none;
      padding:calc(72px + var(--safe-top)) 16px calc(92px + var(--safe-bottom));overflow:auto;
    }
    .viewPanel.active{display:block}
    .panelHeader h2{margin:0 0 6px;font-size:26px;letter-spacing:-.04em}
    .panelHeader p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:20px}
    .visionCanvas{
      position:relative;width:100%;height:410px;border-radius:28px;overflow:hidden;background:#141414;
      border:1px solid var(--border-soft);margin:18px 0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
    }
    .emptyBlock{
      border:1px dashed var(--border);border-radius:22px;padding:18px;color:var(--muted);line-height:20px;background:rgba(255,255,255,.025);
    }
    .taskItem,.passItem{
      border:1px solid var(--border-soft);border-radius:18px;padding:14px;margin:10px 0;background:#181818;
    }
    .taskItem.done{opacity:.55;text-decoration:line-through}

    @media (min-width: 720px){
      #app{max-width:430px;max-height:932px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:32px;overflow:hidden;border:1px solid #2a2a2a;box-shadow:0 30px 100px rgba(0,0,0,.55)}
      body{background:#080808}
    }
  </style>
</head>
<body>
  <div id="app">
    <section id="projectsScreen" class="screen active">
      <h1 class="heroTitle">Creative Flow</h1>
      <p class="heroSub">Мобільне полотно для творчого мислення: вузли, зв’язки, кластери й зафіксоване бачення.</p>
      <div id="projectList" class="projectList"></div>
      <button id="newProjectBtn" class="primaryWide">Новий проєкт</button>
    </section>

    <section id="canvasScreen" class="screen">
      <header class="topbar">
        <button id="backToProjectsBtn" class="topbar__back" aria-label="Назад">←</button>
        <div class="topbar__title">
          <strong id="projectTitle">Project</strong>
          <span id="projectSubtitle">Canvas · 100%</span>
        </div>
        <div id="modePill" class="modePill">Mode</div>
        <button id="menuBtn" class="topbar__menu" aria-label="Меню">⋯</button>
      </header>

      <main id="canvasViewport">
        <div id="canvas">
          <svg id="edgesLayer">
            <defs>
              <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                <path d="M0,0 L0,6 L9,3 z" fill="#7a7a7a"></path>
              </marker>
            </defs>
          </svg>
          <div id="clustersLayer"></div>
          <div id="nodesLayer"></div>
        </div>
      </main>

      <div class="floatingTool">
        <button id="zoomInBtn" class="roundBtn" aria-label="Zoom in">＋</button>
        <button id="zoomOutBtn" class="roundBtn" aria-label="Zoom out">－</button>
        <button id="centerBtn" class="roundBtn" aria-label="Center">⌖</button>
        <button id="visionBtn" class="roundBtn" aria-label="Vision">◎</button>
        <button id="makeBtn" class="roundBtn" aria-label="Make">↳</button>
      </div>

      <nav class="bottomDock">
        <button class="dockBtn" data-action="add"><strong>+</strong><span>Node</span></button>
        <button class="dockBtn" data-action="link"><strong>↔</strong><span>Link</span></button>
        <button class="dockBtn" data-action="cluster"><strong>□</strong><span>Cluster</span></button>
        <button class="dockBtn" data-action="lock"><strong>◆</strong><span>Lock</span></button>
      </nav>
    </section>

    <section id="visionPanel" class="viewPanel">
      <div class="panelHeader">
        <h2>Locked Vision</h2>
        <p id="visionDescription">Зафіксована карта з’явиться після Lock.</p>
      </div>
      <div id="visionContent"></div>
      <button id="closeVisionBtn" class="secondaryBtn" style="width:100%">Назад до Canvas</button>
    </section>

    <section id="makePanel" class="viewPanel">
      <div class="panelHeader">
        <h2>Make</h2>
        <p>Робочий простір після фіксації бачення. Мінімальна версія: проходи роботи, review-нотатки й задачі.</p>
      </div>
      <div class="grid2" style="margin-bottom:14px">
        <button id="addPassBtn" class="primaryBtn">Create pass</button>
        <button id="addReviewBtn" class="secondaryBtn">Review note</button>
      </div>
      <div id="makeContent"></div>
      <button id="closeMakeBtn" class="secondaryBtn" style="width:100%;margin-top:12px">Назад до Canvas</button>
    </section>

    <div id="overlay" class="overlay"></div>
    <div id="bottomSheet" class="bottomSheet"></div>
    <div id="toast" class="toast"></div>
  </div>

  <script>
    const STORAGE_KEY = "creative_flow_canvas_mvp_v1";

    const defaultState = {
      currentProjectId: null,
      projects: [],
      nodes: [],
      edges: [],
      clusters: [],
      lockedVisions: [],
      workPasses: [],
      reviewNotes: [],
      tasks: [],
      viewport: { x: -620, y: -620, zoom: 0.82 }
    };

    let state = loadState();
    let ui = {
      screen: "projects",
      mode: "idle",
      selectedNodeId: null,
      selectedClusterId: null,
      linkSourceId: null,
      clusterSelection: new Set(),
      pan: { active:false, startX:0, startY:0, baseX:0, baseY:0 },
      drag: { active:false, nodeId:null, startX:0, startY:0, nodeX:0, nodeY:0, moved:false },
      pinch: { active:false, startDistance:0, startZoom:1, centerX:0, centerY:0 },
      lastTapNodeId: null
    };

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));
    const uid = (prefix) => `${prefix}_${Math.random().toString(36).slice(2,9)}_${Date.now().toString(36).slice(-4)}`;

    const els = {
      projectsScreen: $("#projectsScreen"),
      canvasScreen: $("#canvasScreen"),
      projectList: $("#projectList"),
      newProjectBtn: $("#newProjectBtn"),
      backToProjectsBtn: $("#backToProjectsBtn"),
      projectTitle: $("#projectTitle"),
      projectSubtitle: $("#projectSubtitle"),
      modePill: $("#modePill"),
      menuBtn: $("#menuBtn"),
      canvasViewport: $("#canvasViewport"),
      canvas: $("#canvas"),
      edgesLayer: $("#edgesLayer"),
      nodesLayer: $("#nodesLayer"),
      clustersLayer: $("#clustersLayer"),
      bottomSheet: $("#bottomSheet"),
      overlay: $("#overlay"),
      toast: $("#toast"),
      zoomInBtn: $("#zoomInBtn"),
      zoomOutBtn: $("#zoomOutBtn"),
      zoomInBtn: $("#zoomInBtn"),
      zoomOutBtn: $("#zoomOutBtn"),
      centerBtn: $("#centerBtn"),
      visionBtn: $("#visionBtn"),
      makeBtn: $("#makeBtn"),
      visionPanel: $("#visionPanel"),
      visionContent: $("#visionContent"),
      visionDescription: $("#visionDescription"),
      closeVisionBtn: $("#closeVisionBtn"),
      makePanel: $("#makePanel"),
      makeContent: $("#makeContent"),
      closeMakeBtn: $("#closeMakeBtn"),
      addPassBtn: $("#addPassBtn"),
      addReviewBtn: $("#addReviewBtn")
    };

    function loadState(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return structuredClone(defaultState);
        const parsed = JSON.parse(raw);
        return {...structuredClone(defaultState), ...parsed, viewport:{...defaultState.viewport, ...(parsed.viewport||{})}};
      }catch(err){
        console.warn("Failed to load state", err);
        return structuredClone(defaultState);
      }
    }

    function saveState(){
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function currentProject(){
      return state.projects.find(p => p.id === state.currentProjectId) || null;
    }

    function currentNodes(){
      return state.nodes.filter(n => n.projectId === state.currentProjectId);
    }

    function currentEdges(){
      return state.edges.filter(e => e.projectId === state.currentProjectId);
    }

    function currentClusters(){
      return state.clusters.filter(c => c.projectId === state.currentProjectId);
    }

    function setScreen(name){
      ui.screen = name;
      els.projectsScreen.classList.toggle("active", name === "projects");
      els.canvasScreen.classList.toggle("active", name === "canvas");
      els.visionPanel.classList.remove("active");
      els.makePanel.classList.remove("active");
      renderAll();
    }

    function openPanel(name){
      if(name === "vision"){
        renderVisionPanel();
        els.visionPanel.classList.add("active");
      }
      if(name === "make"){
        renderMakePanel();
        els.makePanel.classList.add("active");
      }
    }

    function closePanels(){
      els.visionPanel.classList.remove("active");
      els.makePanel.classList.remove("active");
    }

    function toast(text){
      els.toast.textContent = text;
      els.toast.classList.add("show");
      setTimeout(()=>els.toast.classList.remove("show"), 1700);
    }

    function showSheet(html){
      els.overlay.classList.add("active");
      els.bottomSheet.innerHTML = `<div class="sheetGrab"></div>${html}`;
      els.bottomSheet.classList.add("active");
    }

    function closeSheet(){
      els.overlay.classList.remove("active");
      els.bottomSheet.classList.remove("active");
      setTimeout(()=>{ els.bottomSheet.innerHTML = ""; }, 180);
    }

    function canvasPointFromClient(clientX, clientY){
      const rect = els.canvasViewport.getBoundingClientRect();
      return {
        x: (clientX - rect.left - state.viewport.x) / state.viewport.zoom,
        y: (clientY - rect.top - state.viewport.y) / state.viewport.zoom
      };
    }

    function clientPointFromCanvas(x,y){
      const rect = els.canvasViewport.getBoundingClientRect();
      return {
        x: rect.left + state.viewport.x + x * state.viewport.zoom,
        y: rect.top + state.viewport.y + y * state.viewport.zoom
      };
    }

    function getViewportCenterCanvasPoint(){
      const rect = els.canvasViewport.getBoundingClientRect();
      return {
        x: (rect.width / 2 - state.viewport.x) / state.viewport.zoom,
        y: (rect.height / 2 - state.viewport.y) / state.viewport.zoom
      };
    }

    function applyViewport(){
      els.canvas.style.transform = `translate(${state.viewport.x}px, ${state.viewport.y}px) scale(${state.viewport.zoom})`;
      const p = currentProject();
      els.projectSubtitle.textContent = p ? `Canvas · ${Math.round(state.viewport.zoom*100)}%` : "";
    }

    function setMode(mode){
      ui.mode = mode;
      ui.linkSourceId = null;
      ui.clusterSelection.clear();
      ui.selectedNodeId = null;
      if(mode !== "idle") ui.selectedClusterId = null;
      $$(".dockBtn").forEach(btn => btn.classList.toggle("active", btn.dataset.action === mode));
      const label = {
        idle: "",
        add: "",
        link: "Link: tap 2 вузли",
        cluster: "Cluster: вибери вузли",
        lock: "Lock: вибери кластер"
      }[mode] || "";
      els.modePill.textContent = label;
      els.modePill.classList.toggle("active", Boolean(label));
      renderAll();
    }

    function iconForType(type){
      return ({text:"T", image:"◧", link:"↗", color:"■", quote:"“"})[type] || "•";
    }

    function renderAll(){
      renderProjects();
      renderCanvas();
      updateTopbar();
      saveState();
    }

    function renderProjects(){
      if(!els.projectList) return;
      if(!state.projects.length){
        els.projectList.innerHTML = `<div class="emptyBlock">Поки немає проєктів. Створи перший canvas і перевір ядро продукту.</div>`;
        return;
      }
      els.projectList.innerHTML = state.projects.map(project => {
        const nodes = state.nodes.filter(n=>n.projectId===project.id).length;
        const clusters = state.clusters.filter(c=>c.projectId===project.id).length;
        const locked = state.lockedVisions.some(v=>v.projectId===project.id);
        return `
          <button class="projectCard" data-open-project="${project.id}">
            <h3>${escapeHtml(project.title)}</h3>
            <p>${escapeHtml(project.description || "Canvas-first creative project")}</p>
            <div class="projectMeta">
              <span class="chip">${nodes} nodes</span>
              <span class="chip">${clusters} clusters</span>
              <span class="chip">${locked ? "Vision locked" : "No vision"}</span>
            </div>
          </button>
        `;
      }).join("");
      $$("[data-open-project]").forEach(btn => {
        btn.addEventListener("click", () => {
          state.currentProjectId = btn.dataset.openProject;
          setScreen("canvas");
          centerCanvas(false);

    }

    function updateTopbar(){
      const p = currentProject();
      if(!p) return;
      els.projectTitle.textContent = p.title;
      els.projectSubtitle.textContent = `Canvas · ${Math.round(state.viewport.zoom*100)}%`;
    }

    function renderCanvas(){
      if(ui.screen !== "canvas" && !els.canvasScreen.classList.contains("active")) return;
      applyViewport();
      renderClusters();
      renderEdges();
      renderNodes();
    }

    function renderNodes(){
      const nodes = currentNodes();
      els.nodesLayer.innerHTML = nodes.map(node => {
        const selected = ui.selectedNodeId === node.id || ui.linkSourceId === node.id || ui.clusterSelection.has(node.id);
        const classes = [
          "node",
          node.type === "image" ? "imageNode" : "",
          node.type === "link" && node.previewImage ? "linkPreviewNode" : "",
          node.type === "color" ? "colorNode" : "",
          selected ? (ui.linkSourceId === node.id ? "linkSource" : ui.clusterSelection.has(node.id) ? "clusterSelect" : "selected") : ""
        ].filter(Boolean).join(" ");
        const style = `left:${node.x}px;top:${node.y}px;${node.type==="color" ? `--swatch:${escapeAttr(node.content || "#333")}` : ""}`;
        if(node.type === "image"){
          return `<div class="${classes}" data-node-id="${node.id}" style="${style}">
            ${node.content ? `<img src="${escapeAttr(node.content)}" alt="">` : ""}
            <div class="node__title">${escapeHtml(node.title || "Image")}</div>
          </div>`;
        }
        if(node.type === "link" && node.previewImage){
          return `<div class="${classes}" data-node-id="${node.id}" style="${style}">
            <img src="${escapeAttr(node.previewImage)}" alt="">
            <div class="node__title">${escapeHtml(node.previewTitle || node.title || "Link")}</div>
            <div class="node__meta">${escapeHtml(metaForNode(node))}</div>
          </div>`;
        }
        return `<div class="${classes}" data-node-id="${node.id}" style="${style}">
          <div class="node__icon">${iconForType(node.type)}</div>
          <div class="node__body">
            <div class="node__title">${escapeHtml(node.title || node.content || "Node")}</div>
            <div class="node__meta">${escapeHtml(metaForNode(node))}</div>
          </div>
        </div>`;
      }).join("");

      $$("[data-node-id]").forEach(el => {
        el.addEventListener("pointerdown", onNodePointerDown);
      });
    }

    function metaForNode(node){
      if(node.type === "link"){
        try {
          const u = new URL(node.content);
          return node.previewDescription || u.hostname.replace("www.","");
        } catch {
          return node.previewDescription || node.content || "link";
        }
      }
      if(node.type === "color") return node.content || "color";
      if(node.type === "quote") return "quote";
      if(node.type === "image") return "image";
      return node.content && node.content !== node.title ? node.content : "text";
    }

    function nodeCenter(node){
      const el = document.querySelector(`[data-node-id="${node.id}"]`);
      const fallbackW = node.type === "image" ? 116 : (node.type === "link" && node.previewImage ? 138 : 110);
      const fallbackH = node.type === "image" ? 112 : (node.type === "link" && node.previewImage ? 108 : 50);
      return {
        x: node.x + (el ? el.offsetWidth / 2 : fallbackW / 2),
        y: node.y + (el ? el.offsetHeight / 2 : fallbackH / 2)
      };
    }

    function edgeSeed(edge){
      return Array.from(edge.id || '').reduce((acc,ch)=>acc + ch.charCodeAt(0), 0);
    }

    function organicCurvePoints(a,b,seed){
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.max(40, Math.hypot(dx,dy));
      const nx = -dy / dist;
      const ny = dx / dist;
      const curve = Math.min(130, Math.max(28, dist * 0.18));
      const sign = seed % 2 === 0 ? 1 : -1;
      const wobble = ((seed % 11) - 5) * 2.8;
      const cp1 = {x: a.x + dx * 0.28 + nx * (curve * sign + wobble), y: a.y + dy * 0.28 + ny * (curve * sign + wobble)};
      const cp2 = {x: a.x + dx * 0.72 - nx * (curve * sign - wobble * 0.6), y: a.y + dy * 0.72 - ny * (curve * sign - wobble * 0.6)};
      return {cp1, cp2};
    }

    function cubicPoint(a, cp1, cp2, b, t){
      const mt = 1 - t;
      const x = mt*mt*mt*a.x + 3*mt*mt*t*cp1.x + 3*mt*t*t*cp2.x + t*t*t*b.x;
      const y = mt*mt*mt*a.y + 3*mt*mt*t*cp1.y + 3*mt*t*t*cp2.y + t*t*t*b.y;
      return {x, y};
    }

    function organicBranches(a, cp1, cp2, b, seed, cls){
      const branchTs = [0.26, 0.57, 0.8];
      return branchTs.map((t, index) => {
        const p = cubicPoint(a, cp1, cp2, b, t);
        const q = cubicPoint(a, cp1, cp2, b, Math.min(0.98, t + 0.05));
        const ang = Math.atan2(q.y - p.y, q.x - p.x);
        const branchAngle = ang + ((seed + index) % 2 === 0 ? -1.2 : 1.2);
        const len = 10 + ((seed + index*13) % 16);
        const cx = p.x + Math.cos(branchAngle) * len * 0.65;
        const cy = p.y + Math.sin(branchAngle) * len * 0.65;
        const ex = p.x + Math.cos(branchAngle) * len;
        const ey = p.y + Math.sin(branchAngle) * len;
        return `<path class="edgeBranch ${cls}" d="M ${p.x.toFixed(1)} ${p.y.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" />`;
      }).join('');
    }

    function hashString(str){
      let h = 2166136261;
      for(let i=0;i<str.length;i++){
        h ^= str.charCodeAt(i);
        h += (h<<1) + (h<<4) + (h<<7) + (h<<8) + (h<<24);
      }
      return Math.abs(h >>> 0);
    }

    function organicEdgeData(a, b, seedStr = ""){
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const dist = Math.max(Math.hypot(dx, dy), 1);
      const midX = (a.x + b.x) / 2;
      const midY = (a.y + b.y) / 2;
      const nx = -dy / dist;
      const ny = dx / dist;
      const seed = hashString(seedStr);
      const bend = Math.min(70, Math.max(22, dist * 0.16));
      const bendSign = seed % 2 === 0 ? 1 : -1;
      const drift = ((seed % 17) - 8) * 1.6;
      const c1x = a.x + dx * 0.28 + nx * bend * bendSign;
      const c1y = a.y + dy * 0.18 + ny * bend * bendSign;
      const c2x = a.x + dx * 0.74 - nx * (bend * 0.82) * bendSign + drift;
      const c2y = a.y + dy * 0.82 - ny * (bend * 0.82) * bendSign;
      const path = `M ${a.x} ${a.y} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${b.x} ${b.y}`;
      const labelX = midX + nx * bend * 0.18;
      const labelY = midY + ny * bend * 0.18 - 8;
      const branches = [];
      const branchCount = 2;
      for(let i=0;i<branchCount;i++){
        const t = 0.28 + i * 0.34 + ((seed >> (i+1)) % 5) * 0.01;
        const p = cubicPoint(a, {x:c1x,y:c1y}, {x:c2x,y:c2y}, b, t);
        const tangent = cubicTangent(a, {x:c1x,y:c1y}, {x:c2x,y:c2y}, b, t);
        const td = Math.max(Math.hypot(tangent.x, tangent.y), 1);
        const bnx = -tangent.y / td;
        const bny = tangent.x / td;
        const len = Math.min(28, Math.max(14, dist * (0.08 + i*0.02)));
        const dir = ((seed >> (i+3)) % 2 === 0) ? 1 : -1;
        const endX = p.x + bnx * len * dir + tangent.x / td * 6;
        const endY = p.y + bny * len * dir + tangent.y / td * 6;
        const ctrlX = (p.x + endX) / 2 + tangent.x / td * 8;
        const ctrlY = (p.y + endY) / 2 + tangent.y / td * 8;
        branches.push(`M ${p.x} ${p.y} Q ${ctrlX} ${ctrlY}, ${endX} ${endY}`);
      }
      return { path, labelX, labelY, branches };
    }

    function cubicPoint(p0,p1,p2,p3,t){
      const mt = 1-t;
      return {
        x: mt*mt*mt*p0.x + 3*mt*mt*t*p1.x + 3*mt*t*t*p2.x + t*t*t*p3.x,
        y: mt*mt*mt*p0.y + 3*mt*mt*t*p1.y + 3*mt*t*t*p2.y + t*t*t*p3.y
      };
    }

    function cubicTangent(p0,p1,p2,p3,t){
      const mt = 1-t;
      return {
        x: 3*mt*mt*(p1.x-p0.x) + 6*mt*t*(p2.x-p1.x) + 3*t*t*(p3.x-p2.x),
        y: 3*mt*mt*(p1.y-p0.y) + 6*mt*t*(p2.y-p1.y) + 3*t*t*(p3.y-p2.y)
      };
    }

    function renderEdges(){
      const nodes = currentNodes();
      const nodeMap = Object.fromEntries(nodes.map(n=>[n.id,n]));
      const edges = currentEdges().filter(e => nodeMap[e.sourceNodeId] && nodeMap[e.targetNodeId]);
      const lines = edges.map(edge => {
        const a = nodeCenter(nodeMap[edge.sourceNodeId]);
        const b = nodeCenter(nodeMap[edge.targetNodeId]);
        const { path, labelX, labelY, branches } = organicEdgeData(a, b, edge.id + edge.type);
        const label = ({supports:"підтримує", contrasts:"контрастує", leads:"веде до"})[edge.type] || edge.type;
        const cls = edge.type === "supports" ? "supports" : edge.type === "contrasts" ? "contrasts" : "leads";
        return `
          <path class="edgePath ${cls}" d="${path}" />
          ${branches.map(bd => `<path class="edgeBranch ${cls}" d="${bd}" />`).join("")}
          <text class="edgeLabel" x="${labelX}" y="${labelY}" text-anchor="middle">${escapeHtml(label)}</text>
        `;
      }).join("");
      els.edgesLayer.innerHTML = lines;
    }

    function clusterBounds(cluster){
      const nodeMap = Object.fromEntries(currentNodes().map(n=>[n.id,n]));
      const nodes = cluster.nodeIds.map(id=>nodeMap[id]).filter(Boolean);
      if(!nodes.length) return {x:0,y:0,w:0,h:0};
      const boxes = nodes.map(n => {
        const el = document.querySelector(`[data-node-id="${n.id}"]`);
        const w = el ? el.offsetWidth : (n.type === "image" ? 116 : (n.type === "link" && n.previewImage ? 138 : 110));
        const h = el ? el.offsetHeight : (n.type === "image" ? 112 : (n.type === "link" && n.previewImage ? 108 : 50));
        return {x:n.x,y:n.y,w,h};
      });
      const minX = Math.min(...boxes.map(b=>b.x));
      const minY = Math.min(...boxes.map(b=>b.y));
      const maxX = Math.max(...boxes.map(b=>b.x+b.w));
      const maxY = Math.max(...boxes.map(b=>b.y+b.h));
      const pad = 32;
      return {x:minX-pad,y:minY-pad,w:maxX-minX+pad*2,h:maxY-minY+pad*2};
    }

    function renderClusters(){
      els.clustersLayer.innerHTML = currentClusters().map(cluster => {
        const b = clusterBounds(cluster);
        if(!b.w) return "";
        const selected = ui.selectedClusterId === cluster.id;
        return `<div class="clusterBox ${selected ? "selected" : ""}" data-cluster-id="${cluster.id}" style="left:${b.x}px;top:${b.y}px;width:${b.w}px;height:${b.h}px">
          <div class="clusterLabel">${escapeHtml(cluster.title)}</div>
        </div>`;
      }).join("");
      $$("[data-cluster-id]").forEach(el => {
        el.addEventListener("pointerdown", (e)=>{
          e.stopPropagation();
          ui.selectedClusterId = el.dataset.clusterId;
          ui.selectedNodeId = null;
          if(ui.mode === "lock") openLockSheet(ui.selectedClusterId);
          else renderAll();
        });
      });
    }

    function onNodePointerDown(e){
      e.stopPropagation();
      const nodeId = e.currentTarget.dataset.nodeId;

      if(ui.mode === "link"){
        handleLinkTap(nodeId);
        return;
      }
      if(ui.mode === "cluster"){
        if(ui.clusterSelection.has(nodeId)) ui.clusterSelection.delete(nodeId);
        else ui.clusterSelection.add(nodeId);
        ui.selectedNodeId = null;
        renderAll();
        if(ui.clusterSelection.size >= 2) showClusterActionHint();
        return;
      }

      ui.drag = {
        active:true,
        nodeId,
        startX:e.clientX,
        startY:e.clientY,
        nodeX: state.nodes.find(n=>n.id===nodeId)?.x || 0,
        nodeY: state.nodes.find(n=>n.id===nodeId)?.y || 0,
        moved:false
      };
      ui.selectedNodeId = nodeId;
      ui.selectedClusterId = null;
      e.currentTarget.setPointerCapture(e.pointerId);
      e.currentTarget.classList.add("dragging");
      renderAll();
    }

    function onNodePointerMove(e){
      if(!ui.drag.active) return;
      const dx = (e.clientX - ui.drag.startX) / state.viewport.zoom;
      const dy = (e.clientY - ui.drag.startY) / state.viewport.zoom;
      if(Math.abs(dx) + Math.abs(dy) > 3) ui.drag.moved = true;
      const node = state.nodes.find(n=>n.id===ui.drag.nodeId);
      if(node){
        node.x = Math.round(ui.drag.nodeX + dx);
        node.y = Math.round(ui.drag.nodeY + dy);
        node.updatedAt = new Date().toISOString();
        renderCanvas();
      }
    }

    function onNodePointerUp(e){
      if(!ui.drag.active) return;
      const nodeId = ui.drag.nodeId;
      const moved = ui.drag.moved;
      ui.drag.active = false;
      ui.drag.nodeId = null;
      $$(".node.dragging").forEach(n=>n.classList.remove("dragging"));
      saveState();
      if(!moved){
        openNodeSheet(nodeId);
      }
    }

    function handleLinkTap(nodeId){
      if(!ui.linkSourceId){
        ui.linkSourceId = nodeId;
        toast("Обери другий вузол");
        renderAll();
        return;
      }
      if(ui.linkSourceId === nodeId){
        ui.linkSourceId = null;
        renderAll();
        return;
      }
      openRelationSheet(ui.linkSourceId, nodeId);
    }

    function showClusterActionHint(){
      showSheet(`
        <h2 class="sheetTitle">Cluster</h2>
        <p class="sheetText">Вибрано ${ui.clusterSelection.size} вузли. Створи з них творчий напрям.</p>
        <button id="createClusterNow" class="primaryBtn" style="width:100%">Створити Cluster</button>
        <button id="cancelClusterMode" class="ghostBtn" style="width:100%;margin-top:8px">Скасувати</button>
      `);
      $("#createClusterNow").onclick = () => openCreateClusterSheet();
      $("#cancelClusterMode").onclick = () => { closeSheet(); setMode("idle"); };
    }

    function openAddSheet(){
      showSheet(`
        <h2 class="sheetTitle">Add node</h2>
        <p class="sheetText">Додай думку, референс або матеріал прямо на canvas.</p>
        <div class="grid2">
          <button class="optionBtn" data-node-type="text"><b>Text</b><span>коротка думка</span></button>
          <button class="optionBtn" data-node-type="quote"><b>Quote</b><span>фраза / інсайт</span></button>
          <button class="optionBtn" data-node-type="link"><b>Link</b><span>посилання</span></button>
          <button class="optionBtn" data-node-type="color"><b>Color</b><span>#HEX колір</span></button>
          <button class="optionBtn" data-node-type="image"><b>Image</b><span>фото / скрін</span></button>
        </div>
      `);
      $$("[data-node-type]").forEach(btn => btn.onclick = () => openNodeForm(btn.dataset.nodeType));
    }

    function openNodeForm(type, existingId = null){
      const existing = existingId ? state.nodes.find(n=>n.id===existingId) : null;
      const typeTitle = {text:"Text node", quote:"Quote node", link:"Link node", color:"Color node", image:"Image node"}[type] || "Node";
      let extra = "";
      if(type === "image"){
        extra = `
          <div class="field">
            <label class="label">Image file</label>
            <input id="nodeImageFile" type="file" accept="image/*" />
          </div>
          <p class="sheetText">Для першого прототипу зображення зберігається в браузері. Великі фото краще стискати.</p>
        `;
      }
      if(type === "link"){
        extra = `
          <div class="field">
            <label class="label">Preview image URL (необов’язково)</label>
            <input id="nodePreviewUrlInput" value="${escapeAttr(existing?.previewImage || "")}" placeholder="https://...jpg" />
          </div>
          <div class="row" style="margin-bottom:12px">
            <button id="fetchPreviewBtn" class="secondaryBtn" style="flex:1">Підтягнути preview</button>
            <button id="clearPreviewBtn" class="ghostBtn" style="width:110px">Очистити</button>
          </div>
          <p class="sheetText">Спробуємо підтягнути прев’ю через відкритий unfurl-сервіс. Якщо сайт блокує прев’ю, можна вставити preview image URL вручну.</p>
        `;
      }
      showSheet(`
        <h2 class="sheetTitle">${existing ? "Edit" : "New"} ${typeTitle}</h2>
        <div class="field">
          <label class="label">Title</label>
          <input id="nodeTitleInput" value="${escapeAttr(existing?.title || "")}" placeholder="Наприклад: Raw texture" />
        </div>
        <div class="field">
          <label class="label">${type === "link" ? "URL" : type === "color" ? "HEX" : "Content"}</label>
          ${type === "quote" || type === "text" ? `<textarea id="nodeContentInput" placeholder="Коротка думка...">${escapeHtml(existing?.content || "")}</textarea>` : `<input id="nodeContentInput" value="${escapeAttr(existing?.content || (type==="color" ? "#d8c7a1" : ""))}" placeholder="${type === "link" ? "https://..." : "#d8c7a1"}" />`}
        </div>
        ${extra}
        <div class="row">
          <button id="saveNodeBtn" class="primaryBtn" style="flex:1">${existing ? "Зберегти" : "Add to Canvas"}</button>
          <button id="cancelNodeBtn" class="secondaryBtn" style="width:110px">Cancel</button>
        </div>
      `);
      $("#cancelNodeBtn").onclick = closeSheet;
      if(type === "link"){
        const previewInput = $("#nodePreviewUrlInput");
        $("#clearPreviewBtn").onclick = () => {
          previewInput.value = "";
        };
        $("#fetchPreviewBtn").onclick = async () => {
          const url = $("#nodeContentInput").value.trim();
          if(!url){ toast("Встав URL"); return; }
          const btn = $("#fetchPreviewBtn");
          btn.disabled = true;
          btn.textContent = "Loading…";
          const preview = await fetchLinkPreview(url);
          if(preview.image) previewInput.value = preview.image;
          if(!$("#nodeTitleInput").value.trim() && preview.title) $("#nodeTitleInput").value = preview.title;
          btn.disabled = false;
          btn.textContent = "Підтягнути preview";
          toast(preview.image ? "Preview знайдено" : "Не вдалося підтягнути image");
        };
      }
      $("#saveNodeBtn").onclick = async () => {
        const title = $("#nodeTitleInput").value.trim();
        let content = $("#nodeContentInput").value.trim();
        let previewImage = existing?.previewImage || "";
        let previewTitle = existing?.previewTitle || "";
        let previewDescription = existing?.previewDescription || "";
        if(type === "image"){
          const file = $("#nodeImageFile")?.files?.[0];
          if(file) content = await fileToDataURL(file);
          if(!content && !existing?.content){
            toast("Додай image file");
            return;
          }
        }
        if(type === "link"){
          previewImage = $("#nodePreviewUrlInput")?.value.trim() || "";
          if(!previewImage && content){
            const preview = await fetchLinkPreview(content);
            previewImage = preview.image || "";
            previewTitle = preview.title || "";
            previewDescription = preview.description || "";
          }
        }
        if(type !== "image" && !title && !content){
          toast("Додай текст");
          return;
        }
        if(existing){
          existing.title = title || fallbackTitle(type, content);
          existing.content = content || existing.content;
          if(type === "link"){
            existing.previewImage = previewImage;
            existing.previewTitle = previewTitle || existing.previewTitle || existing.title;
            existing.previewDescription = previewDescription || existing.previewDescription || "";
          }
          existing.updatedAt = new Date().toISOString();
        }else{
          const center = getViewportCenterCanvasPoint();
          const jitter = currentNodes().length * 12;
          state.nodes.push({
            id: uid("node"),
            projectId: state.currentProjectId,
            type,
            title: title || fallbackTitle(type, content),
            content,
            previewImage: type === "link" ? previewImage : "",
            previewTitle: type === "link" ? (previewTitle || title || fallbackTitle(type, content)) : "",
            previewDescription: type === "link" ? previewDescription : "",
            x: Math.round(center.x - 55 + jitter),

    async function fetchLinkPreview(url){
      const out = { title:"", description:"", image:"" };
      try {
        const endpoint = `https://api.microlink.io/?url=${encodeURIComponent(url)}&screenshot=false&meta=true&audio=false&video=false&iframe=false`;
        const res = await fetch(endpoint);
        const json = await res.json();
        const data = json.data || {};
        out.title = data.title || "";
        out.description = data.description || "";
        out.image = data.image?.url || data.logo?.url || "";
      } catch(err) {
        console.warn("preview fetch failed", err);
      }
      if(!out.image){
        try {
          const u = new URL(url);
          out.title = out.title || u.hostname.replace("www.", "");
        } catch {}
      }
      return out;
    }

    function fallbackTitle(type, content){
      if(type === "link"){
        try { return new URL(content).hostname.replace("www.",""); } catch { return "Link"; }
      }
      if(type === "color") return content || "Color";
      if(type === "image") return "Image";
      if(type === "quote") return content ? content.slice(0,42) : "Quote";
      return content ? content.slice(0,42) : "Text";
    }

    function fileToDataURL(file){
      return new Promise((resolve,reject)=>{
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function lockCluster(clusterId){
      const cluster = state.clusters.find(c=>c.id===clusterId);
      if(!cluster) return;
      const nodeIds = new Set(cluster.nodeIds);
      const nodes = currentNodes().filter(n=>nodeIds.has(n.id)).map(n=>({...n}));
      const edges = currentEdges().filter(e=>nodeIds.has(e.sourceNodeId) && nodeIds.has(e.targetNodeId)).map(e=>({...e}));
      const archived = currentClusters().filter(c=>c.id!==clusterId && c.status==="active").map(c=>c.id);

      state.clusters.forEach(c => {
        if(c.projectId !== state.currentProjectId) return;
        c.status = c.id === clusterId ? "locked" : "archived";
      });

      state.lockedVisions = state.lockedVisions.filter(v=>v.projectId!==state.currentProjectId);
      state.lockedVisions.push({
        id: uid("vision"),
        projectId: state.currentProjectId,
        clusterId,
        snapshot: {
          cluster: {...cluster, status:"locked"},
          nodes,
          edges,
          viewport: {...state.viewport}
        },
        archivedClusterIds: archived,
        lockedAt: new Date().toISOString()
      });
      saveState();
    }

    function renderMiniVision(vision, container){
      const nodes = vision.snapshot.nodes || [];
      const edges = vision.snapshot.edges || [];
      if(!nodes.length){
        container.innerHTML = "";
        return;
      }
      const minX = Math.min(...nodes.map(n=>n.x));
      const minY = Math.min(...nodes.map(n=>n.y));
      const maxX = Math.max(...nodes.map(n=>n.x + (n.type==="image"?116:120)));
      const maxY = Math.max(...nodes.map(n=>n.y + (n.type==="image"?112:58)));
      const w = maxX - minX + 80;
      const h = maxY - minY + 80;
      const scale = Math.min(container.clientWidth / w, container.clientHeight / h, 1.2);
      const offsetX = (container.clientWidth - w*scale)/2 + 40*scale;
      const offsetY = (container.clientHeight - h*scale)/2 + 40*scale;
      const nodeMap = Object.fromEntries(nodes.map(n=>[n.id,n]));
      const miniEdges = edges.map(e => {
        const a = nodeMap[e.sourceNodeId], b = nodeMap[e.targetNodeId];
        if(!a || !b) return "";
        const ax = offsetX + (a.x - minX + 55) * scale;
        const ay = offsetY + (a.y - minY + 24) * scale;
        const bx = offsetX + (b.x - minX + 55) * scale;
        const by = offsetY + (b.y - minY + 24) * scale;
        return `<line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke="#8b8b8b" stroke-width="2" />`;
      }).join("");
      const miniNodes = nodes.map(n => {
        const x = offsetX + (n.x - minX) * scale;
        const y = offsetY + (n.y - minY) * scale;
        const label = escapeHtml(n.title || n.content || "Node");
        if(n.type === "image" && n.content){
          return `<div style="position:absolute;left:${x}px;top:${y}px;width:${116*scale}px;border:1px solid #333;border-radius:${14*scale}px;background:#1f1f1f;padding:${5*scale}px;overflow:hidden">
            <img src="${escapeAttr(n.content)}" style="width:100%;height:${70*scale}px;object-fit:cover;border-radius:${9*scale}px;display:block">
          </div>`;
        }
        return `<div style="position:absolute;left:${x}px;top:${y}px;max-width:${140*scale}px;border:1px solid #333;border-radius:${14*scale}px;background:#1f1f1f;color:#f2f2f2;padding:${9*scale}px ${10*scale}px;font-size:${12*scale}px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${label}</div>`;
      }).join("");
      container.innerHTML = `<svg style="position:absolute;inset:0;width:100%;height:100%">${miniEdges}</svg>${miniNodes}`;
    }

    function centerCanvas(animate = true){
      state.viewport.x = -760;

    function zoomAtClient(clientX, clientY, nextZoom){
      const rect = els.canvasViewport.getBoundingClientRect();
      const targetZoom = Math.max(0.35, Math.min(1.7, nextZoom));
      const localX = clientX - rect.left;
      const localY = clientY - rect.top;
      const worldX = (localX - state.viewport.x) / state.viewport.zoom;
      const worldY = (localY - state.viewport.y) / state.viewport.zoom;
      state.viewport.zoom = targetZoom;
      state.viewport.x = localX - worldX * targetZoom;
      state.viewport.y = localY - worldY * targetZoom;
      applyViewport();
      saveState();
    }

    function zoomBy(delta){
      const rect = els.canvasViewport.getBoundingClientRect();
      zoomAtClient(rect.left + rect.width / 2, rect.top + rect.height / 2, state.viewport.zoom + delta);
      renderAll();
    }

    function escapeHtml(str=""){
      return String(str).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    }
    function escapeAttr(str=""){ return escapeHtml(str).replace(/`/g,"&#96;"); }

    const activeTouchPointers = new Set();

    // Canvas pan / pinch
    els.canvasViewport.addEventListener("pointerdown", (e)=>{
      if(e.pointerType === 'touch') activeTouchPointers.add(e.pointerId);
      if(ui.pinch.active) return;
      if(e.target.closest(".node") || e.target.closest(".clusterBox")) return;
      ui.selectedNodeId = null;
      ui.selectedClusterId = null;
      if(ui.mode !== "idle" || ui.pinch.active) return;
      if(e.pointerType === 'touch' && activeTouchPointers.size > 1) return;
      ui.pan = {active:true,startX:e.clientX,startY:e.clientY,baseX:state.viewport.x,baseY:state.viewport.y};
      els.canvasViewport.setPointerCapture(e.pointerId);
      renderAll();
    });

    els.canvasViewport.addEventListener("pointermove", (e)=>{
      if(ui.pan.active && !ui.pinch.active){
        state.viewport.x = ui.pan.baseX + (e.clientX - ui.pan.startX);
        state.viewport.y = ui.pan.baseY + (e.clientY - ui.pan.startY);
        applyViewport();
      }
      onNodePointerMove(e);
    });

    els.canvasViewport.addEventListener("pointerup", (e)=>{
      if(e.pointerType === 'touch') activeTouchPointers.delete(e.pointerId);
      ui.pan.active = false;
      onNodePointerUp(e);
      saveState();
    });

    els.canvasViewport.addEventListener("pointercancel", (e)=>{
      if(e.pointerType === 'touch') activeTouchPointers.delete(e.pointerId);
      ui.pan.active = false;
      ui.drag.active = false;
    });

    els.canvasViewport.addEventListener("wheel", (e)=>{
      e.preventDefault();
      zoomBy(e.deltaY > 0 ? -0.06 : 0.06);
    }, {passive:false});

    // Stable touch pinch
    els.canvasViewport.addEventListener("touchstart", (e)=>{
      if(e.touches.length === 2){
        const [t1, t2] = Array.from(e.touches);
        const rect = els.canvasViewport.getBoundingClientRect();
        const mid = midpoint(t1, t2);
        ui.pan.active = false;
        ui.drag.active = false;
        ui.pinch = {
          active:true,
          startDistance: distance(t1, t2),
          startZoom: state.viewport.zoom,
          worldX: (mid.x - rect.left - state.viewport.x) / state.viewport.zoom,
          worldY: (mid.y - rect.top - state.viewport.y) / state.viewport.zoom
        };
      }
    }, {passive:false});

    els.canvasViewport.addEventListener("touchmove", (e)=>{
      if(e.touches.length === 2 && ui.pinch.active){
        e.preventDefault();
        const [t1, t2] = Array.from(e.touches);
        const rect = els.canvasViewport.getBoundingClientRect();
        const mid = midpoint(t1, t2);
        const newZoom = Math.max(0.35, Math.min(1.7, ui.pinch.startZoom * (distance(t1, t2) / ui.pinch.startDistance)));
        state.viewport.zoom = newZoom;
        state.viewport.x = (mid.x - rect.left) - ui.pinch.worldX * newZoom;
        state.viewport.y = (mid.y - rect.top) - ui.pinch.worldY * newZoom;
        applyViewport();
      }
    }, {passive:false});

    els.canvasViewport.addEventListener("touchend", ()=>{ if(activeTouchPointers.size < 2) ui.pinch.active = false; saveState(); });

    function distance(a,b){
      return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    }

    function midpoint(a,b){
      return { x:(a.clientX + b.clientX)/2, y:(a.clientY + b.clientY)/2 };
    }

    // Events
    els.newProjectBtn.onclick = createProjectSheet;
    els.zoomInBtn.onclick = () => zoomBy(0.12);
    els.zoomOutBtn.onclick = () => zoomBy(-0.12);
    els.backToProjectsBtn.onclick = () => setScreen("projects");
    els.overlay.onclick = closeSheet;
    els.zoomInBtn.onclick = () => zoomBy(0.12);
    els.zoomOutBtn.onclick = () => zoomBy(-0.12);
    els.centerBtn.onclick = () => centerCanvas();
    els.visionBtn.onclick = () => openPanel("vision");
    els.makeBtn.onclick = () => openPanel("make");
    els.closeVisionBtn.onclick = closePanels;
    els.closeMakeBtn.onclick = closePanels;
    els.addPassBtn.onclick = () => openWorkPassSheet("pass");
    els.addReviewBtn.onclick = () => openWorkPassSheet("review");
    els.menuBtn.onclick = openMenuSheet;

    $$(".dockBtn").forEach(btn => {
      btn.onclick = () => {
        const action = btn.dataset.action;
        if(action === "add"){ openAddSheet(); return; }
        if(action === "link"){ setMode(ui.mode === "link" ? "idle" : "link"); return; }
        if(action === "cluster"){ setMode(ui.mode === "cluster" ? "idle" : "cluster"); return; }
        if(action === "lock"){ setMode("lock"); openLockSheet(ui.selectedClusterId); return; }
      };
    });

    async function hydrateMissingLinkPreviews(){
      const targets = state.nodes.filter(n => n.type === 'link' && n.content && !n.previewImage && !n.metaAttempted).slice(0, 6);
      if(!targets.length) return;
      for(const node of targets){
        const meta = await fetchLinkMetadata(node.content);
        node.metaAttempted = true;
        if(meta){
          node.linkMeta = meta;
          node.previewImage = meta.image || node.previewImage || '';
          if(!node.title || node.title === 'Link' || node.title === hostFromUrl(node.content)) node.title = meta.title || node.title;
        }
      }
      renderAll();
      saveState();
    }

    // Boot
    if(!state.projects.length){
      const id = uid("project");
      state.projects.push({
        id,
        title:"Brand Identity",
        description:"Перший canvas для тесту Creative Flow",
        createdAt:new Date().toISOString(),
        updatedAt:new Date().toISOString()
      });
      state.currentProjectId = id;
      seedStarterNodes(id);
      saveState();
    }
    renderAll();
    hydrateMissingLinkPreviews();

    // Open the first project directly on mobile after initial boot? Keep projects as landing.
  </script>
</body>
</html>
