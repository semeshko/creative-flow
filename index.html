<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0d0d0b">
  <title>Creative Flow v3 — Mycelium</title>
  <style>
    :root{
      --bg:#0d0d0b;--panel:#181713;--node:#242118;--node2:#302c21;
      --text:#f4f0e8;--muted:#a59f92;--muted2:#706a5e;
      --accent:#d8c7a1;--green:#a9c8b2;--border:rgba(244,240,232,.11);
      --border2:rgba(216,199,161,.28);--danger:#e48277;
      --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:var(--text)}
    body{position:fixed;inset:0;overscroll-behavior:none}
    button,input,textarea{font:inherit;color:inherit} button{border:0;cursor:pointer}
    input,textarea{width:100%;border:1px solid var(--border);background:#0e0d0b;color:var(--text);border-radius:18px;padding:14px;outline:none}
    textarea{min-height:112px;resize:vertical}
    #app{position:fixed;inset:0;overflow:hidden;background:
      radial-gradient(circle at 50% 33%,rgba(216,199,161,.08),transparent 38%),
      radial-gradient(circle at 12% 80%,rgba(169,200,178,.07),transparent 28%),
      linear-gradient(180deg,#10100e,#080808)}
    .topbar{position:absolute;left:0;right:0;top:0;z-index:40;height:calc(62px + var(--safe-top));
      padding:calc(12px + var(--safe-top)) 14px 8px;display:flex;align-items:center;gap:10px;
      background:linear-gradient(180deg,rgba(13,13,11,.98),rgba(13,13,11,.68),transparent)}
    .brand{width:38px;height:38px;border-radius:15px;background:
      radial-gradient(circle at 38% 34%,var(--accent),transparent 34%),
      radial-gradient(circle at 68% 70%,rgba(169,200,178,.8),transparent 30%),#1b1a15;border:1px solid var(--border2)}
    .title{flex:1;min-width:0}.title b{display:block;font-size:15px}.title span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .topBtn{width:38px;height:38px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid var(--border)}

    #stage{position:absolute;inset:0;padding-top:calc(70px + var(--safe-top));padding-bottom:calc(154px + var(--safe-bottom));overflow:hidden;touch-action:none}
    #svg{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;overflow:visible}
    #nodes{position:absolute;inset:0;z-index:2;pointer-events:none}
    .hint{position:absolute;left:18px;right:18px;top:calc(72px + var(--safe-top));z-index:5;text-align:center;color:var(--muted);font-size:12px;line-height:17px}
    .hint b{color:var(--accent)}
    .bubble{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:999px;background:linear-gradient(180deg,var(--node2),var(--node));
      border:1px solid var(--border2);box-shadow:0 16px 54px rgba(0,0,0,.38);display:flex;align-items:center;justify-content:center;text-align:center;
      padding:12px;pointer-events:auto;user-select:none;overflow:hidden;transition:all .34s cubic-bezier(.2,.8,.18,1)}
    .bubble.center{width:152px;height:152px;z-index:5;border-color:rgba(216,199,161,.62);box-shadow:0 0 0 8px rgba(216,199,161,.055),0 28px 86px rgba(0,0,0,.58)}
    .bubble.neighbor{width:96px;height:96px;font-size:12px;z-index:4}
    .bubble.outer{width:66px;height:66px;font-size:10px;opacity:.45;z-index:3}
    .bubble img{width:100%;height:100%;object-fit:cover;border-radius:999px}
    .bubble span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;line-height:1.15;font-weight:750;letter-spacing:-.02em}
    .bubble.neighbor span{-webkit-line-clamp:3}.bubble.outer span{-webkit-line-clamp:2}

    .branch{fill:none;stroke:rgba(216,199,161,.6);stroke-width:2.2;stroke-linecap:round;filter:drop-shadow(0 0 5px rgba(216,199,161,.10))}
    .branch.main{stroke:rgba(216,199,161,.82);stroke-width:2.65}.branch.soft{stroke:rgba(169,200,178,.45)}
    .hypha{fill:none;stroke:rgba(216,199,161,.20);stroke-width:1.1;stroke-linecap:round}
    .membrane{fill:rgba(216,199,161,.035);stroke:rgba(216,199,161,.20);stroke-width:1.4}

    .radial{position:absolute;left:50%;top:50%;z-index:12;width:220px;height:220px;transform:translate(-50%,-50%);pointer-events:none;opacity:0;transition:.2s}
    .radial.on{opacity:1}.radial button{position:absolute;width:72px;height:72px;border-radius:999px;background:var(--accent);color:#17130c;font-size:11px;font-weight:850;pointer-events:auto;box-shadow:0 18px 48px rgba(0,0,0,.42)}
    .radial b{display:block;font-size:19px}.radial [data-kind=thought]{left:74px;top:-4px}.radial [data-kind=image]{left:-2px;top:74px}.radial [data-kind=link]{right:-2px;top:74px}.radial [data-kind=quote]{left:74px;bottom:-4px}

    .seeds{position:absolute;left:10px;right:10px;bottom:calc(80px + var(--safe-bottom));z-index:32;min-height:62px;border-radius:24px;padding:8px;background:rgba(16,15,13,.74);border:1px solid var(--border);display:flex;gap:8px;overflow-x:auto;backdrop-filter:blur(20px)}
    .seeds::-webkit-scrollbar{display:none}.seed{flex:0 0 auto;max-width:132px;min-width:82px;height:46px;border-radius:17px;background:rgba(255,255,255,.055);border:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:7px 10px}
    .seed img{width:32px;height:32px;border-radius:12px;object-fit:cover}.seed span{font-size:11px;line-height:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.seedEmpty{color:var(--muted2);font-size:12px;display:flex;align-items:center;padding:0 10px}
    .dock{position:absolute;left:10px;right:10px;bottom:calc(10px + var(--safe-bottom));z-index:35;height:62px;border-radius:25px;padding:7px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:7px;background:rgba(17,16,14,.84);border:1px solid var(--border);box-shadow:0 24px 80px rgba(0,0,0,.52);backdrop-filter:blur(22px)}
    .dock button{border-radius:19px;background:rgba(255,255,255,.045);color:var(--muted);font-size:11px;font-weight:780}.dock b{display:block;font-size:17px;color:var(--text)}.dock button.on{background:var(--accent);color:#15130d}.dock button.on b{color:#15130d}

    .panel{position:absolute;inset:0;z-index:60;display:none;background:var(--bg);padding:calc(74px + var(--safe-top)) 16px calc(24px + var(--safe-bottom));overflow:auto}
    .panel.on{display:block}.panel h1{margin:0 0 6px;font-size:30px;letter-spacing:-.045em}.panel p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:20px}
    .panelTop{position:fixed;left:0;right:0;top:0;z-index:65;height:calc(62px + var(--safe-top));padding:calc(12px + var(--safe-top)) 14px 8px;background:linear-gradient(180deg,rgba(13,13,11,.98),rgba(13,13,11,.68),transparent)}
    .mapStage{position:relative;width:100%;height:620px;overflow:hidden;border-radius:30px;background:linear-gradient(180deg,#141310,#0e0e0c);border:1px solid var(--border)}
    .mapStage svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}.mapNodes{position:absolute;inset:0;z-index:2}
    .mapNode{position:absolute;width:74px;height:74px;border-radius:999px;transform:translate(-50%,-50%);background:linear-gradient(180deg,#2a271f,#1d1b16);border:1px solid var(--border2);font-size:10px;font-weight:760;line-height:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;overflow:hidden}
    .mapNode.active{width:94px;height:94px;border-color:rgba(216,199,161,.72);box-shadow:0 0 0 7px rgba(216,199,161,.07)}.mapNode.locked{border-color:rgba(169,200,178,.78)}
    .step,.item{border:1px solid var(--border);background:rgba(255,255,255,.04);border-radius:22px;padding:14px;margin:10px 0}.step{display:flex;gap:10px}.idx{width:26px;height:26px;border-radius:999px;background:var(--accent);color:#15130d;display:grid;place-items:center;font-size:12px;font-weight:850;flex:0 0 auto}.txt{font-size:14px;line-height:18px}.txt small{display:block;color:var(--muted);font-size:11px;margin-top:3px}

    .overlay{position:absolute;inset:0;background:rgba(0,0,0,.44);z-index:90;display:none}.overlay.on{display:block}
    .sheet{position:absolute;left:0;right:0;bottom:0;z-index:100;max-height:88dvh;overflow:auto;background:linear-gradient(180deg,#1f1d18,#12110f);border-top:1px solid var(--border);border-radius:30px 30px 0 0;padding:10px 16px calc(16px + var(--safe-bottom));transform:translateY(112%);transition:.24s cubic-bezier(.2,.8,.2,1)}
    .sheet.on{transform:translateY(0)}.grab{width:42px;height:4px;border-radius:999px;background:#4a463c;margin:0 auto 16px}.sheet h2{margin:0 0 6px;font-size:22px}.sheet .sh{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:19px}
    .field{margin:12px 0}.label{display:block;font-size:12px;color:var(--muted);margin:0 0 7px}.row{display:flex;gap:10px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .primary,.secondary,.ghost,.danger{height:52px;border-radius:18px;font-weight:830}.primary{background:var(--accent);color:#15130d}.secondary{background:rgba(255,255,255,.06);border:1px solid var(--border)}.ghost{background:transparent;color:var(--muted)}.danger{background:rgba(228,130,119,.12);border:1px solid rgba(228,130,119,.22);color:#ffc2bb}
    .empty{border:1px dashed var(--border);border-radius:24px;padding:16px;color:var(--muted);background:rgba(255,255,255,.025);font-size:13px;line-height:19px}
    .toast{position:absolute;left:50%;bottom:calc(152px + var(--safe-bottom));z-index:140;transform:translate(-50%,18px);opacity:0;background:rgba(244,240,232,.94);color:#11100d;border-radius:999px;padding:10px 14px;font-size:13px;font-weight:830;transition:.22s;max-width:86%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .toast.on{opacity:1;transform:translate(-50%,0)}
    @media(min-width:720px){#app{max-width:430px;max-height:932px;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:34px;border:1px solid #28251e;box-shadow:0 30px 110px rgba(0,0,0,.66)}}
  </style>
</head>
<body>
<div id="app">
  <header class="topbar"><div class="brand"></div><div class="title"><b>Creative Flow</b><span id="status">Mycelium Focus Lens</span></div><button id="menu" class="topBtn">⋯</button></header>
  <main id="stage">
    <svg id="svg"></svg><div id="nodes"></div><div id="hint" class="hint"></div>
    <div id="radial" class="radial">
      <button data-kind="thought"><b>＋</b>Thought</button><button data-kind="image"><b>◧</b>Image</button><button data-kind="link"><b>↗</b>Link</button><button data-kind="quote"><b>“</b>Quote</button>
    </div>
  </main>
  <div id="seeds" class="seeds"></div>
  <nav class="dock"><button id="capture"><b>＋</b>Capture</button><button id="grow"><b>✦</b>Grow</button><button id="mapBtn"><b>◎</b>Map</button><button id="lock"><b>◆</b>Lock</button></nav>

  <section id="mapPanel" class="panel"><div class="panelTop"><button id="closeMap" class="topBtn">←</button></div><h1>Map</h1><p>Огляд грибниці. Для роботи повернись у Focus Lens.</p><div id="mapStage" class="mapStage"><svg id="mapSvg"></svg><div id="mapNodes" class="mapNodes"></div></div></section>
  <section id="visionPanel" class="panel"><div class="panelTop"><button id="closeVision" class="topBtn">←</button></div><h1>Locked Branch</h1><p id="visionIntro">Фіксація гілки з’явиться після Lock.</p><div id="visionContent"></div></section>
  <section id="makePanel" class="panel"><div class="panelTop"><button id="closeMake" class="topBtn">←</button></div><h1>Make</h1><p>Робота після фіксації: проходи, review, наступні дії.</p><div class="grid2"><button id="addPass" class="primary">Create pass</button><button id="addReview" class="secondary">Review</button></div><div id="makeContent"></div></section>

  <div id="overlay" class="overlay"></div><div id="sheet" class="sheet"></div><div id="toast" class="toast"></div>
</div>

<script>
const KEY="creative_flow_mycelium_v3";
let state=load();
let ui={grow:false,lp:null};
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const uid=p=>p+"_"+Math.random().toString(36).slice(2,9)+"_"+Date.now().toString(36).slice(-4);
const E={status:$("#status"),svg:$("#svg"),nodes:$("#nodes"),hint:$("#hint"),radial:$("#radial"),seeds:$("#seeds"),capture:$("#capture"),grow:$("#grow"),mapBtn:$("#mapBtn"),lock:$("#lock"),menu:$("#menu"),overlay:$("#overlay"),sheet:$("#sheet"),toast:$("#toast"),mapPanel:$("#mapPanel"),mapSvg:$("#mapSvg"),mapNodes:$("#mapNodes"),visionPanel:$("#visionPanel"),visionIntro:$("#visionIntro"),visionContent:$("#visionContent"),makePanel:$("#makePanel"),makeContent:$("#makeContent")};
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{active:null,nodes:[],edges:[],seeds:[],locked:null,passes:[],reviews:[],tasks:[]}}catch{return{active:null,nodes:[],edges:[],seeds:[],locked:null,passes:[],reviews:[],tasks:[]}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function demo(){if(state.nodes.length)return;let a=node("thought","Core idea","Що це має відчувати?",null),b=node("quote","Від хаосу до бачення","",a.id),c=node("thought","raw texture","груба матеріальність",a.id),d=node("thought","dark palette","темна палітра без шуму",c.id);state.nodes.push(a,b,c,d);state.edges.push(edge(a.id,b.id,"leads"),edge(a.id,c.id,"supports"),edge(c.id,d.id,"leads"));state.active=a.id;save()}
function node(type,title,content,parent){return{id:uid("n"),type,title:title||fallback(type,content),content:content||"",parentId:parent||null,image:"",url:type==="link"?content:"",createdAt:new Date().toISOString()}}
function edge(a,b,type){return{id:uid("e"),source:a,target:b,type:type||"leads"}}
function n(id){return state.nodes.find(x=>x.id===id)} function active(){return n(state.active)||state.nodes[0]||null}
function neigh(id){return state.edges.filter(e=>e.source===id||e.target===id).map(e=>n(e.source===id?e.target:e.source)).filter(Boolean)}
function second(id){let f=new Set(neigh(id).map(x=>x.id)),out=[];f.forEach(fid=>neigh(fid).forEach(x=>{if(x.id!==id&&!f.has(x.id)&&!out.find(o=>o.id===x.id))out.push(x)}));return out}
function setActive(id){if(!n(id))return;state.active=id;ui.grow=false;render()}
function layout(){let r=$("#stage").getBoundingClientRect(),cx=r.width/2,cy=r.height/2+8,a=active();if(!a)return{r,cx,cy,pts:{},first:[],second:[]};let first=neigh(a.id).slice(0,7),sec=second(a.id).slice(0,10),pts={[a.id]:{x:cx,y:cy,ring:"center"}};let rad=Math.min(r.width,r.height)*.285,start=-Math.PI/2;first.forEach((x,i)=>{let ang=start+Math.PI*2*i/Math.max(first.length,1)+(first.length===1?Math.PI/2:0);pts[x.id]={x:cx+Math.cos(ang)*rad,y:cy+Math.sin(ang)*rad,ring:"neighbor"}});let orad=Math.min(r.width,r.height)*.425;sec.forEach((x,i)=>{let ang=start+Math.PI*2*i/Math.max(sec.length,1)+.22;pts[x.id]={x:cx+Math.cos(ang)*orad,y:cy+Math.sin(ang)*orad,ring:"outer"}});return{r,cx,cy,a,first,second:sec,pts,vis:new Set([a.id,...first.map(x=>x.id),...sec.map(x=>x.id)])}}
function render(){renderFocus();renderSeeds();E.status.textContent=active()?`${state.nodes.length} nodes · focus: ${clip(active().title,28)}`:"Capture first seed";E.grow.classList.toggle("on",ui.grow);save()}
function renderFocus(){let L=layout(),a=active();if(!a){E.nodes.innerHTML="";E.svg.innerHTML="";E.hint.innerHTML="Натисни <b>Capture</b>, щоб створити seed.";return}E.hint.innerHTML=ui.grow?"Grow mode: створи нову гілку від центрального вузла.":"Tap на сусіда переносить фокус. Grow вирощує нову гілку.";let visible=[a,...L.first,...L.second];E.nodes.innerHTML=visible.map(x=>bubble(x,L.pts[x.id])).join("");renderSvg(L);$$(".bubble").forEach(el=>{let id=el.dataset.id;el.onclick=()=>id===state.active?openNode(id):setActive(id)});E.radial.classList.toggle("on",ui.grow)}
function bubble(x,p){let img=x.image||"";let cls=`bubble ${p.ring}`;return `<button class="${cls}" data-id="${x.id}" style="left:${p.x}px;top:${p.y}px">${img?`<img src="${escA(img)}">`:`<span>${esc(x.title||x.content||"Node")}</span>`}</button>`}
function renderSvg(L){let ids=L.vis||new Set(),paths=state.edges.filter(e=>ids.has(e.source)&&ids.has(e.target)).map(e=>{let a=L.pts[e.source],b=L.pts[e.target];if(!a||!b)return"";let o=org(a,b,e.id),main=e.source===state.active||e.target===state.active?"main":"soft";return `<path class="branch ${main}" d="${o.path}"/>${o.hy.map(h=>`<path class="hypha" d="${h}"/>`).join("")}`}).join("");E.svg.innerHTML=membrane(L)+paths}
function membrane(L){let pts=[L.pts[L.a?.id],...L.first.map(x=>L.pts[x.id])].filter(Boolean);if(pts.length<3)return"";let cx=pts.reduce((s,p)=>s+p.x,0)/pts.length,cy=pts.reduce((s,p)=>s+p.y,0)/pts.length;pts=pts.sort((a,b)=>Math.atan2(a.y-cy,a.x-cx)-Math.atan2(b.y-cy,b.x-cx)).map(p=>{let dx=p.x-cx,dy=p.y-cy,d=Math.max(Math.hypot(dx,dy),1);return{x:p.x+dx/d*38,y:p.y+dy/d*38}});return `<path class="membrane" d="${smooth(pts)}"/>`}
function smooth(P){let d=`M ${P[0].x} ${P[0].y}`;for(let i=0;i<P.length;i++){let p0=P[(i-1+P.length)%P.length],p1=P[i],p2=P[(i+1)%P.length],p3=P[(i+2)%P.length],c1={x:p1.x+(p2.x-p0.x)/6,y:p1.y+(p2.y-p0.y)/6},c2={x:p2.x-(p3.x-p1.x)/6,y:p2.y-(p3.y-p1.y)/6};d+=` C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${p2.x} ${p2.y}`}return d+" Z"}
function org(a,b,s){let dx=b.x-a.x,dy=b.y-a.y,dist=Math.max(Math.hypot(dx,dy),1),nx=-dy/dist,ny=dx/dist,seed=hash(s),sign=seed%2?1:-1,bend=Math.min(78,Math.max(30,dist*.2)),c1={x:a.x+dx*.28+nx*bend*sign,y:a.y+dy*.18+ny*bend*sign},c2={x:a.x+dx*.73-nx*bend*.75*sign,y:a.y+dy*.84-ny*bend*.75*sign},path=`M ${a.x} ${a.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${b.x} ${b.y}`,hy=[];for(let i=0;i<2;i++){let t=.34+i*.26+((seed>>(i+1))%7)*.01,p=cubic(a,c1,c2,b,t),tan=tangent(a,c1,c2,b,t),td=Math.max(Math.hypot(tan.x,tan.y),1),bx=-tan.y/td,by=tan.x/td,dir=((seed>>(i+4))%2)?1:-1,len=18+((seed>>(i+7))%16),end={x:p.x+bx*len*dir+tan.x/td*5,y:p.y+by*len*dir+tan.y/td*5},ctrl={x:(p.x+end.x)/2+tan.x/td*8,y:(p.y+end.y)/2+tan.y/td*8};hy.push(`M ${p.x} ${p.y} Q ${ctrl.x} ${ctrl.y}, ${end.x} ${end.y}`)}return{path,hy}}
function cubic(p0,p1,p2,p3,t){let m=1-t;return{x:m*m*m*p0.x+3*m*m*t*p1.x+3*m*t*t*p2.x+t*t*t*p3.x,y:m*m*m*p0.y+3*m*m*t*p1.y+3*m*t*t*p2.y+t*t*t*p3.y}}
function tangent(p0,p1,p2,p3,t){let m=1-t;return{x:3*m*m*(p1.x-p0.x)+6*m*t*(p2.x-p1.x)+3*t*t*(p3.x-p2.x),y:3*m*m*(p1.y-p0.y)+6*m*t*(p2.y-p1.y)+3*t*t*(p3.y-p2.y)}}
function hash(s){let h=2166136261;for(let c of s){h^=c.charCodeAt(0);h+=(h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)}return Math.abs(h>>>0)}
function renderSeeds(){E.seeds.innerHTML=state.seeds.length?state.seeds.map(s=>`<button class="seed" data-seed="${s.id}">${s.image?`<img src="${escA(s.image)}">`:""}<span>${esc(s.title||s.content||"Seed")}</span></button>`).join(""):`<div class="seedEmpty">Seed tray порожній. Capture додає сировину сюди.</div>`;$$("[data-seed]").forEach(b=>b.onclick=()=>openSeed(b.dataset.seed))}
function show(html){E.overlay.classList.add("on");E.sheet.innerHTML=`<div class="grab"></div>${html}`;E.sheet.classList.add("on")}
function close(){E.overlay.classList.remove("on");E.sheet.classList.remove("on");setTimeout(()=>E.sheet.innerHTML="",170)}
function capture(){show(`<h2>Capture seed</h2><p class="sh">Збережи матеріал. Потім прикріпи його до активної думки як гілку.</p><div class="field"><label class="label">Text / link / thought</label><textarea id="capText" placeholder="Pinterest link, фраза, думка..."></textarea></div><div class="field"><label class="label">Image / screenshot optional</label><input id="capImg" type="file" accept="image/*"></div><div class="row"><button id="saveSeed" class="primary" style="flex:1">Save seed</button><button id="cancel" class="secondary" style="width:110px">Cancel</button></div>`);$("#cancel").onclick=close;$("#saveSeed").onclick=async()=>{let text=$("#capText").value.trim(),file=$("#capImg").files[0],image="";if(file)image=await fileURL(file);if(!text&&!image)return toast("Додай текст або image");let type=image?"image":isUrl(text)?"link":"thought";state.seeds.push({id:uid("s"),type,title:image?(text||"Image seed"):fallback(type,text),content:text,url:isUrl(text)?text:"",image,createdAt:new Date().toISOString()});close();render();toast("Seed збережено")}}
function openSeed(id){let s=state.seeds.find(x=>x.id===id),a=active();if(!s)return;show(`<h2>${esc(s.title||"Seed")}</h2><p class="sh">${a?`Прикріпити до: ${esc(a.title)}`:"Створити перший вузол."}</p>${s.image?`<img src="${escA(s.image)}" style="width:100%;max-height:260px;object-fit:cover;border-radius:24px;margin-bottom:12px">`:""}${s.content?`<div class="empty" style="margin-bottom:12px">${esc(s.content)}</div>`:""}<button id="attach" class="primary" style="width:100%;margin-bottom:10px">${a?"Attach as branch":"Create root node"}</button><button id="delSeed" class="danger" style="width:100%">Delete seed</button>`);$("#attach").onclick=()=>{let nd=node(s.type,s.title,s.content,a?.id);nd.image=s.image||"";nd.url=s.url||"";state.nodes.push(nd);if(a)state.edges.push(edge(a.id,nd.id,"leads"));state.active=nd.id;state.seeds=state.seeds.filter(x=>x.id!==id);close();render();toast("Seed став гілкою")};$("#delSeed").onclick=()=>{state.seeds=state.seeds.filter(x=>x.id!==id);close();render()}}
function grow(kind="thought"){let a=active();if(!a)return capture();show(`<h2>New ${kind}</h2><p class="sh">Нова гілка виросте з: ${esc(a.title)}.</p><div class="field"><label class="label">Title</label><input id="gTitle" placeholder="Назва думки"></div><div class="field"><label class="label">${kind==="link"?"URL":kind==="image"?"Caption optional":"Content"}</label>${kind==="thought"||kind==="quote"?`<textarea id="gContent" placeholder="Напиши думку..."></textarea>`:`<input id="gContent" placeholder="${kind==="link"?"https://...":"Короткий опис"}">`}</div>${kind==="image"?`<div class="field"><label class="label">Image</label><input id="gImg" type="file" accept="image/*"></div>`:""}<div class="grid2"><button id="saveGrow" class="primary">Grow</button><button id="cancel" class="secondary">Cancel</button></div>`);$("#cancel").onclick=close;$("#saveGrow").onclick=async()=>{let title=$("#gTitle").value.trim(),content=$("#gContent").value.trim(),image="";if(kind==="image"){let f=$("#gImg").files[0];if(f)image=await fileURL(f);if(!image&&!content&&!title)return toast("Додай image або текст")}else if(!title&&!content)return toast("Додай текст");let nd=node(kind,title||fallback(kind,content),content,a.id);nd.image=image;state.nodes.push(nd);state.edges.push(edge(a.id,nd.id,kind==="quote"?"supports":"leads"));state.active=nd.id;ui.grow=false;close();render();toast("Гілка виросла")}}
function openNode(id){let x=n(id),br=branch(id);show(`<h2>${esc(x.title)}</h2><p class="sh">${br.length} nodes у гілці до цього вузла.</p>${x.image?`<img src="${escA(x.image)}" style="width:100%;max-height:260px;object-fit:cover;border-radius:24px;margin-bottom:12px">`:""}${x.content?`<div class="empty" style="margin-bottom:12px">${esc(x.content)}</div>`:""}<div class="grid2"><button id="focus" class="primary">Focus</button><button id="growHere" class="secondary">Grow</button></div><button id="lockHere" class="secondary" style="width:100%;margin-top:10px">Lock branch here</button><button id="delete" class="danger" style="width:100%;margin-top:10px">Delete node</button>`);$("#focus").onclick=()=>{close();setActive(id)};$("#growHere").onclick=()=>{close();setActive(id);ui.grow=true;render()};$("#lockHere").onclick=()=>{close();lockBranch(id);openVision()};$("#delete").onclick=()=>{delNode(id);close();render()}}
function delNode(id){state.nodes.filter(x=>x.parentId===id).map(x=>x.id).forEach(delNode);state.edges=state.edges.filter(e=>e.source!==id&&e.target!==id);state.nodes=state.nodes.filter(x=>x.id!==id);if(state.active===id)state.active=state.nodes[0]?.id||null}
function branch(id){let out=[],cur=n(id),guard=new Set();while(cur&&!guard.has(cur.id)){out.unshift(cur);guard.add(cur.id);cur=cur.parentId?n(cur.parentId):null}return out}
function lockBranch(id=state.active){let br=branch(id);if(!br.length)return toast("Немає гілки для Lock");state.locked={id:uid("l"),nodeId:id,nodeIds:br.map(x=>x.id),snapshot:br.map(x=>({...x})),lockedAt:new Date().toISOString()};toast("Branch зафіксовано");save()}
function openVision(){hidePanels();let L=state.locked;if(!L){E.visionIntro.textContent="Фіксація гілки з’явиться після Lock.";E.visionContent.innerHTML=`<div class="empty">Обери вузол і натисни Lock.</div>`}else{let date=new Date(L.lockedAt).toLocaleDateString("uk-UA",{day:"2-digit",month:"short",year:"numeric"});E.visionIntro.textContent=`Locked ${date}. Це гілка рішення, а не весь хаос.`;E.visionContent.innerHTML=`${L.snapshot.map((x,i)=>`<div class="step"><div class="idx">${i+1}</div><div class="txt">${esc(x.title)}<small>${esc(x.content||x.type)}</small></div></div>`).join("")}<button id="startMake" class="primary" style="width:100%;margin-top:10px">Start Making</button>`;setTimeout(()=>{$("#startMake").onclick=openMake},0)}E.visionPanel.classList.add("on")}
function openMap(){hidePanels();E.mapPanel.classList.add("on");renderMap()}
function renderMap(){let W=$("#mapStage").clientWidth||360,H=$("#mapStage").clientHeight||620;if(!state.nodes.length)return;let root=state.nodes.find(x=>!x.parentId)||state.nodes[0],levels=bfs(root.id),pos={},max=Math.max(...Object.keys(levels).map(Number));Object.entries(levels).forEach(([l,ids])=>{l=+l;let y=80+l*Math.min(120,(H-160)/Math.max(max,1));ids.forEach((id,i)=>{let x=ids.length===1?W/2:45+(W-90)*(i/(ids.length-1));pos[id]={x,y}})});E.mapSvg.innerHTML=state.edges.map(e=>{let a=pos[e.source],b=pos[e.target];return a&&b?`<path d="${org(a,b,e.id).path}" fill="none" stroke="rgba(216,199,161,.48)" stroke-width="1.7" stroke-linecap="round"/>`:""}).join("");let locked=new Set(state.locked?.nodeIds||[]);E.mapNodes.innerHTML=state.nodes.map(x=>{let p=pos[x.id];return p?`<button class="mapNode ${x.id===state.active?"active":""} ${locked.has(x.id)?"locked":""}" data-map="${x.id}" style="left:${p.x}px;top:${p.y}px">${esc(clip(x.title,34))}</button>`:""}).join("");$$("[data-map]").forEach(b=>b.onclick=()=>{setActive(b.dataset.map);hidePanels()})}
function bfs(root){let levels={},seen=new Set(),q=[{id:root,l:0}];while(q.length){let {id,l}=q.shift();if(seen.has(id))continue;seen.add(id);(levels[l]??=[]).push(id);state.edges.forEach(e=>{let next=e.source===id?e.target:e.target===id?e.source:null;if(next&&!seen.has(next))q.push({id:next,l:l+1})})}state.nodes.forEach(x=>{if(!seen.has(x.id)){let l=Object.keys(levels).length;(levels[l]??=[]).push(x.id)}});return levels}
function openMake(){hidePanels();renderMake();E.makePanel.classList.add("on")}
function renderMake(){E.makeContent.innerHTML=`<h3>Passes</h3>${state.passes.length?state.passes.map(x=>`<div class="item"><b>${esc(x.title)}</b><span>${esc(x.note)}</span></div>`).join(""):`<div class="empty">Ще немає проходів роботи.</div>`}<h3>Review</h3>${state.reviews.length?state.reviews.map(x=>`<div class="item"><b>${esc(x.title)}</b><span>${esc(x.note)}</span></div>`).join(""):`<div class="empty">Review-нотатки з’являться тут.</div>`}<h3>Tasks</h3>${state.tasks.length?state.tasks.map(x=>`<button class="item" data-task="${x.id}" style="width:100%;text-align:left;color:var(--text);opacity:${x.done?.48:1}"><b>${x.done?"●":"○"} ${esc(x.title)}</b><span>${esc(x.source||"")}</span></button>`).join(""):`<div class="empty">Задачі можна створювати з Review.</div>`}`;$$("[data-task]").forEach(b=>b.onclick=()=>{let t=state.tasks.find(x=>x.id===b.dataset.task);if(t)t.done=!t.done;save();renderMake()})}
function work(type){let rev=type==="review";show(`<h2>${rev?"Review note":"Create pass"}</h2><p class="sh">${rev?"Оціни роботу і створи наступну дію.":"Зафіксуй прохід без оцінки."}</p><div class="field"><label class="label">Title</label><input id="wTitle"></div><div class="field"><label class="label">Note</label><textarea id="wNote"></textarea></div>${rev?`<label class="row" style="color:var(--muted);font-size:13px;margin-bottom:12px"><input id="taskCheck" type="checkbox" style="width:auto"> Створити task</label>`:""}<button id="saveWork" class="primary" style="width:100%">Save</button>`);$("#saveWork").onclick=()=>{let title=$("#wTitle").value.trim(),note=$("#wNote").value.trim();if(!title&&!note)return toast("Додай текст");if(rev){let r={id:uid("r"),title:title||"Review",note,createdAt:new Date().toISOString()};state.reviews.push(r);if($("#taskCheck")?.checked)state.tasks.push({id:uid("t"),title:title||clip(note,50),source:note,done:false})}else state.passes.push({id:uid("p"),title:title||"Work pass",note});close();renderMake();save()}}
function menu(){show(`<h2>Creative Flow v3</h2><p class="sh">Mycelium Focus Lens. Не Miro на телефоні, а фокусована грибниця думок.</p><div class="grid2"><button id="mVision" class="secondary">Vision</button><button id="mMake" class="secondary">Make</button></div><button id="export" class="secondary" style="width:100%;margin-top:10px">Export JSON</button><button id="clear" class="danger" style="width:100%;margin-top:10px">Clear local data</button>`);$("#mVision").onclick=()=>{close();openVision()};$("#mMake").onclick=()=>{close();openMake()};$("#export").onclick=exportJSON;$("#clear").onclick=()=>{if(confirm("Очистити локальні дані?")){localStorage.removeItem(KEY);state=load();demo();close();render()}}}
function exportJSON(){let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="creative-flow-mycelium.json";a.click();URL.revokeObjectURL(url)}
function hidePanels(){$$(".panel").forEach(p=>p.classList.remove("on"))}
function toast(t){E.toast.textContent=t;E.toast.classList.add("on");setTimeout(()=>E.toast.classList.remove("on"),1700)}
function fileURL(f){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function isUrl(s){try{new URL(s);return true}catch{return false}}function fallback(type,c){if(type==="link"){try{return new URL(c).hostname.replace("www.","")}catch{return"Link"}}if(type==="quote")return c?`“${clip(c,38)}”`:"Quote";if(type==="image")return"Image";return c?clip(c,42):"Thought"}
function clip(s="",n=40){s=String(s);return s.length>n?s.slice(0,n-1)+"…":s}function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function escA(s=""){return esc(s).replace(/`/g,"&#96;")}
E.capture.onclick=capture;E.grow.onclick=()=>{if(!active())return capture();ui.grow=!ui.grow;render()};E.mapBtn.onclick=openMap;E.lock.onclick=()=>{if(!active())return toast("Немає активного вузла");lockBranch(state.active);openVision()};E.menu.onclick=menu;E.overlay.onclick=close;$("#closeMap").onclick=hidePanels;$("#closeVision").onclick=hidePanels;$("#closeMake").onclick=hidePanels;$("#addPass").onclick=()=>work("pass");$("#addReview").onclick=()=>work("review");$$(".radial button").forEach(b=>b.onclick=()=>grow(b.dataset.kind));window.onresize=render;
demo();render();
</script>
</body>
</html>
